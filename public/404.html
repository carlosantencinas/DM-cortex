<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM Cortex</title>
    <script>
      // GitHub Pages serves this file for direct SPA routes. Store the route
      // briefly, return to the app entry point, and let main.jsx restore it.
      const repo = '/DM-cortex/';
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      if (path.startsWith(repo) && path !== repo) {
        sessionStorage.setItem('dm-cortex-spa-path', path.slice(repo.length) + search + hash);
      }
      window.location.replace(repo);
    </script>
  </head>
  <body>
    <p>Cargando DM Cortex…</p>
  </body>
</html>
